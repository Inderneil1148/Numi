<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1C23" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>
    <radialGradient id="fav-coin-metal" cx="36%" cy="34%" r="66%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E4E8" />
      <stop offset="55%" stop-color="#B4B9C2" />
      <stop offset="85%" stop-color="#7A818E" />
      <stop offset="100%" stop-color="#4E5461" />
    </radialGradient>
    <linearGradient id="fav-rim-hl" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#9CA3AF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#374151" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Tile -->
  <rect width="128" height="128" rx="30" fill="url(#bg-grad)" />
  <rect width="126" height="126" x="1" y="1" rx="29" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Denarius Roman Coin Centered in App Icon -->
  <g transform="translate(18, 18) scale(0.92)">
    <!-- Outer Coin Rim & Disc -->
    <circle cx="50" cy="50" r="47.5" fill="url(#fav-coin-metal)" stroke="url(#fav-rim-hl)" stroke-width="2" />

    <!-- Beaded Pearl Rim -->
    <circle cx="50" cy="50" r="43.5" stroke="#3D4450" stroke-width="1.6" stroke-dasharray="1.8, 2.4" fill="none" opacity="0.8" />
    <circle cx="50" cy="50" r="42" stroke="#FFFFFF" stroke-width="0.8" stroke-dasharray="1.8, 2.4" fill="none" opacity="0.9" />

    <!-- Outer Lettering / Dots: IMP CAES - DIVI F AVG -->
    <g fill="#3D4450" opacity="0.75" font-family="sans-serif" font-size="4.8" font-weight="bold">
      <text x="11" y="46" transform="rotate(-50 11 46)">I</text>
      <text x="13" y="37" transform="rotate(-35 13 37)">M</text>
      <text x="17" y="29" transform="rotate(-20 17 29)">P</text>
      <text x="24" y="21" transform="rotate(-5 24 21)">·</text>
      <text x="28" y="18" transform="rotate(10 28 18)">C</text>
      <text x="34" y="16" transform="rotate(20 34 16)">A</text>
      <text x="40" y="15" transform="rotate(30 40 15)">E</text>
      <text x="46" y="15" transform="rotate(40 46 15)">S</text>
      <text x="73" y="22" transform="rotate(60 73 22)">D</text>
      <text x="78" y="28" transform="rotate(75 78 28)">I</text>
      <text x="82" y="35" transform="rotate(90 82 35)">V</text>
      <text x="84" y="43" transform="rotate(105 84 43)">I</text>
      <text x="82" y="58" transform="rotate(130 82 58)">A</text>
      <text x="78" y="66" transform="rotate(145 78 66)">V</text>
      <text x="72" y="73" transform="rotate(160 72 73)">G</text>
    </g>

    <!-- Emperor Augustus Laureate Profile Relief -->
    <path
      d="M51 22 c3.8 0 7.2 1.8 9.5 4.8 c1.2 1.6 3.5 3.2 4.8 4.2 c1.4 1 2.2 2.5 1.5 4.2 c-0.8 1.8-1.5 2.5-0.8 3.8 c0.8 1.5 2 2.8 1.2 4.5 c-0.8 1.5-2.8 2-3.8 2 c-1 1-1.5 2.5-2.2 4.2 c-1.2 2.8-1.8 5.8-3.8 8.2 c-2.8 3.5-7.5 6.2-12.8 7 c-2.5 0.4-5.2-0.2-7.2-1.2 c-1.5-0.8-1.8-2.5-0.8-3.8 c1.2-1.5 2.8-3 3.8-5 c1-2 1.2-4.5 0.5-7 c-1.2-3.5-3.8-5.8-4.5-9 c-1-4.2 0.2-8.8 2.8-12.5 c2.8-3.8 7-6.2 11.7-6.4 z"
      fill="#475060"
    />

    <!-- Laurel Wreath Details in Silver & Lime Ribbon Dot -->
    <path d="M44 24.5 c2.5-2.5 6-2 8 0.5 c-2.5 2-6 1.5-8-0.5 z" fill="#FFFFFF" />
    <path d="M50 22.5 c2.8-2 6.5-1.2 8.2 1.2 c-2.5 2-6 1-8.2-1.2 z" fill="#FFFFFF" />
    <path d="M39 28.5 c2.5-2.5 6-1.5 7.8 0.8 c-2.2 2-6 1.2-7.8-0.8 z" fill="#FFFFFF" />
    <circle cx="63.5" cy="35.5" r="2.8" fill="#9EE42A" />
  </g>
</svg>
